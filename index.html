<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planta de Seis Tanques · Supervisório</title>
</head>
<body>
    <div class="app">
        <!-- Barra superior: modo, conexão, cenário, controle da simulação, alarmes -->
        <header class="topbar" id="topbar"></header>

        <main class="main-area">
            <!-- Sinótico (P&ID ao vivo) -->
            <div class="synoptic-wrap">
                <div id="synoptic"></div>
            </div>

            <!-- Faceplate do componente selecionado -->
            <aside id="faceplate" class="faceplate" hidden aria-label="Painel do componente selecionado"></aside>
        </main>

        <!-- Alarmes ativos -->
        <footer class="alarm-bar" id="alarm-bar" aria-live="polite"></footer>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
